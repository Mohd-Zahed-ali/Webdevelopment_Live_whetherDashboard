<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard | Orbitern Internship</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1><i class="fa-solid fa-cloud-sun"></i> Weather Dashboard</h1>
            <p>Real-time weather insights worldwide</p>
        </header>

        <section class="search-section">
            <form id="search-form" class="search-form">
                <div class="input-group">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="city-input" placeholder="Search city..." autocomplete="off" required />
                </div>
                <button type="submit" id="search-btn">Search</button>
            </form>
            <div id="recent-searches" class="recent-searches"></div>
        </section>

        <div id="loading-spinner" class="status-card hidden">
            <div class="spinner"></div>
            <p>Fetching weather parameters...</p>
        </div>

        <div id="error-message" class="status-card error-card hidden">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="error-text">City not found.</span>
        </div>

        <main id="weather-card" class="weather-card hidden">
            <div class="card-header">
                <div>
                    <h2 id="city-name">City, Country</h2>
                    <p id="current-date">--</p>
                </div>
                <div class="condition-badge" id="weather-condition">--</div>
            </div>

            <div class="card-body">
                <div class="temp-display">
                    <i id="weather-icon" class="fa-solid fa-sun weather-hero-icon"></i>
                    <div class="temperature">
                        <span id="temp-value">--</span><span class="unit">°C</span>
                    </div>
                </div>

                <div class="metrics-grid">
                    <div class="metric-item">
                        <i class="fa-solid fa-temperature-half"></i>
                        <div>
                            <span class="metric-label">Feels Like</span>
                            <span id="feels-like-val" class="metric-value">--°C</span>
                        </div>
                    </div>
                    <div class="metric-item">
                        <i class="fa-solid fa-droplet"></i>
                        <div>
                            <span class="metric-label">Humidity</span>
                            <span id="humidity-val" class="metric-value">--%</span>
                        </div>
                    </div>
                    <div class="metric-item">
                        <i class="fa-solid fa-wind"></i>
                        <div>
                            <span class="metric-label">Wind Speed</span>
                            <span id="wind-val" class="metric-value">-- km/h</span>
                        </div>
                    </div>
                    <div class="metric-item">
                        <i class="fa-solid fa-gauge-high"></i>
                        <div>
                            <span class="metric-label">Pressure</span>
                            <span id="pressure-val" class="metric-value">-- hPa</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Week 3 Forecast Container Placeholder -->
            <section id="forecast-section" class="hidden" style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <h3>5-Day Forecast</h3>
                <div id="forecast-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-top: 12px;"></div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
